# Dependency file khusus buat Streamlit in Snowflake (SiS) - beda dari
# requirements.txt (dipakai Streamlit Cloud/pip). SiS warehouse runtime cuma
# bisa install dari Snowflake Anaconda channel, format-nya conda environment.yml.
#
# CATATAN python-docx: cek dulu apa tersedia di Snowflake Anaconda channel-mu
# lewat query ini di Snowsight:
#   SELECT * FROM INFORMATION_SCHEMA.PACKAGES
#   WHERE LANGUAGE = 'python' AND PACKAGE_NAME ILIKE '%docx%';
# Kalau HASILNYA KOSONG, hapus baris "python-docx" di bawah - upload .docx
# nggak akan bisa dipakai di Snowflake, tapi upload .json (dari
# dump_flow_via_notebook.py) tetap jalan tanpa itu.
name: app_environment
channels:
  - snowflake
dependencies:
  - pandas
  - openpyxl
  - requests
  - python-docx
